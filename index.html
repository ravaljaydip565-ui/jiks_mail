<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script>
const {useState, useEffect, useCallback, useRef} = React;

/* ============ REAL BACKEND ============ */
// Two real providers:
//  1) temp.tf — disposable aliases on Gmail / Outlook / Hotmail / high.edu.pl
//  2) mail.tm  — independent disposable inboxes (@emalupe.com etc.)
// All calls go through our own Netlify proxy (same origin → no CORS issue).
const MAILTM  = "https://api.mail.tm";
const TEMPTF  = "https://temp.tf";
const H = { "Accept":"application/json", "Content-Type":"application/json" };
// temp.tf provider domains (what users can pick)
const TF_DOMAINS = [
  { id:"gmail",       label:"Gmail",    domain:"gmail.com" },
  { id:"outlook",     label:"Outlook",  domain:"outlook.com" },
  { id:"hotmail",     label:"Hotmail",  domain:"hotmail.com" },
  { id:"high.edu.pl", label:"high.edu.pl", domain:"high.edu.pl" },
];
// Primary path: our own Netlify serverless proxy (/.netlify/functions/proxy)
// Fallback: direct (if CORS allows) + public proxies (for running the file standalone)
const PROXIES = ["/.netlify/functions/proxy", "https://cors.eu.org/", "https://api.allorigins.win/raw?url="];

// unified fetch:
//  1) our Netlify function proxy first (reliable, no CORS, no timeout)
//  2) direct attempt
//  3) public CORS proxies (for standalone use)
async function proxiedFetch(url, opts){
  opts = opts || {};
  const method = (opts.method || "GET").toUpperCase();
  let lastErr = null;

  const abortedFetch = async (u, o, ms) => {
    const c = new AbortController();
    const t = setTimeout(()=> c.abort(), ms);
    try { return await fetch(u, Object.assign({}, o, { signal: c.signal })); }
    finally { clearTimeout(t); }
  };

  const parseResp = async (r) => {
    const tx = await r.text();
    if(tx.trim().startsWith("<!DOCTYPE")||tx.trim().toLowerCase().startsWith("<html")) throw new Error("html");
    return JSON.parse(tx || "{}");
  };

  // 1) Netlify function proxy (same origin — most reliable)
  try {
    const proxyUrl = "/.netlify/functions/proxy?target=" + encodeURIComponent(url);
    const r = await abortedFetch(proxyUrl, { method, headers: opts.headers, body: opts.body }, 25000);
    if(r.ok){
      const j = await r.json();
      return { ok:true, json: (j && j.data !== undefined) ? j.data : j };
    }
  } catch(e){ lastErr = e; }

  // 2) direct attempt
  try {
    const r = await abortedFetch(url, Object.assign({}, opts, { signal: undefined }), 15000);
    if(!r.ok) throw new Error("http "+r.status);
    return { ok:true, json: await parseResp(r) };
  } catch(e){ lastErr = e; }

  // 3) public CORS proxies
  for(const p of PROXIES.slice(1)){
    try {
      const target = p + url;
      const r = await abortedFetch(target, Object.assign({}, opts, { signal: undefined }), 20000);
      if(!r.ok) continue;
      return { ok:true, json: await parseResp(r) };
    } catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("network failed");
}

async function mtDomains(){
  const r = await proxiedFetch(MAILTM+"/domains",{headers:H});
  const j = r.json;
  const arr = Array.isArray(j) ? j : (j["hydra:member"]||j["member"]||[]);
  const list = arr.filter(d=>d && d.isActive).map(d=>d.domain).filter(Boolean);
  return list.length ? list : ["emalupe.com"];
}
async function mtCreate(address,password){
  const r = await proxiedFetch(MAILTM+"/accounts",{method:"POST",headers:H,body:JSON.stringify({address,password})});
  const j = r.json;
  if(j && (j["@type"]==="ConstraintViolationList" || j.violations || j.code || j.status>=400 || (j.message && !j.address))) throw new Error("create failed");
  return j;
}
async function mtToken(address,password){
  const r = await proxiedFetch(MAILTM+"/token",{method:"POST",headers:H,body:JSON.stringify({address,password})});
  const j = r.json;
  if(!j.token) throw new Error("no token");
  return j.token;
}
async function mtMessages(token){
  const r = await proxiedFetch(MAILTM+"/messages",{headers:{...H,"Authorization":"Bearer "+token}});
  const j = r.json;
  const arr = Array.isArray(j) ? j : (j["hydra:member"]||j["member"]||[]);
  return arr.map(m=>({
    id:m.id,
    from:(m.from && (m.from.address||m.from))||"unknown",
    fromName:(m.from && m.from.name)||null,
    subject:m.subject||"(no subject)",
    intro:m.intro||"",
    text:m.text||"",
    html:(m.html && m.html.length)?m.html[0]:"",
    createdAt:m.createdAt,
    attachments:m.attachments||[],
    seen:m.seen
  }));
}

// ---- temp.tf helpers ----
// generate: GET /api/account?providers=<id>&plus=1&dot=(gmail dot)
//   returns { email } — a real disposable alias on the chosen provider
async function tfGenerate(providerId){
  let dot = "0", plus = "1";
  if(providerId === "gmail"){ dot = "1"; }        // gmail supports dot-aliases
  const q = "providers=" + encodeURIComponent(providerId) + "&dot=" + dot + "&plus=" + plus;
  const r = await proxiedFetch(TEMPTF+"/api/account?" + q, { headers: H });
  const j = r.json;
  const email = (typeof j.email === "string") ? j.email.trim().toLowerCase() : "";
  if(!email) throw new Error("provider pool empty");
  return email;
}
// inbox: POST /api/check { email } → { data:[messages], totalReceived }
async function tfInbox(email){
  const r = await proxiedFetch(TEMPTF+"/api/check", { method:"POST", headers: H, body: JSON.stringify({ email }) });
  const j = r.json;
  const arr = (Array.isArray(j.data) ? j.data : []);
  return arr.map((m, i) => ({
    id: m.id || (email + "-" + i),
    from: m.from || m.sender || "unknown",
    fromName: m.fromName || m.senderName || (m.from ? m.from.split("@")[0] : "unknown"),
    subject: m.subject || "(no subject)",
    intro: m.preview || m.intro || "",
    text: m.text || m.body || "",
    html: m.html || "",
    createdAt: m.date || m.createdAt || Date.now(),
    attachments: m.attachments || []
  }));
}

/* ============ STORAGE ============ */
const LSK = "jiksmail_v2";
function persist(s){ try{ localStorage.setItem(LSK, JSON.stringify(s)); }catch(e){} }
function restore(){ try{ const r=localStorage.getItem(LSK); return r?JSON.parse(r):null; }catch(e){ return null; } }

/* ============ UTILS ============ */
function rnd(n){ const c="abcdefghijklmnopqrstuvwxyz0123456789"; let s=""; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function tAgo(iso){ try{ const d=new Date(iso); const m=Math.floor((Date.now()-d.getTime())/60000); if(m<1)return "now"; if(m<60)return m+"m"; const h=Math.floor(m/60); if(h<24)return h+"h"; return Math.floor(h/24)+"d"; }catch(e){ return ""; } }
function friendlyErr(e, prefix){
  const m = (e && e.message) ? String(e.message) : "";
  if(/abort/i.test(m)) return "Network timeout — check connection & retry";
  if(/failed to fetch|network|fetch/i.test(m)) return "Can't reach email service — retry in a moment";
  return (m && m.length) ? (prefix + ": " + m.slice(0,60)) : prefix;
}

/* ============ ICONS ============ */
function I(paths){ return function(p){ return React.createElement("svg",Object.assign({viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"},p), paths.map((d,i)=>React.createElement("path",{key:i,d:d}))); }; }
const icons = {
  mail: I(["M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z","m22 6-10 7L2 6"]),
  inbox: I(["M22 12h-6l-2 3h-4l-2-3H2","M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"]),
  switchI: I(["M17 1l4 4-4 4","M3 11V9a4 4 0 0 1 4-4h14","M7 23l-4-4 4-4","M21 13v2a4 4 0 0 1-4 4H3"]),
  other: I(["M12 12h.01","M19 12h.01","M5 12h.01"]),
  copy: I(["M9 9h11a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z","M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"]),
  refresh: I(["M23 4v6h-6","M20.49 15a9 9 0 1 1-2.12-9.36L23 10"]),
  plus: I(["M12 5v14","M5 12h14"]),
  sun: I(["M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z","M12 1v2","M12 21v2","M4.22 4.22l1.42 1.42","M18.36 18.36l1.42 1.42","M1 12h2","M21 12h2","M4.22 19.78l1.42-1.42","M18.36 5.64l1.42-1.42"]),
  moon: I(["M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"]),
  chev: I(["M9 18l6-6-6-6"]),
  check: I(["M20 6 9 17l-5-5"]),
